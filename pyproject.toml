[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "portfolio-research-desk"
version = "0.2.0"
description = "Time-aware equity research and portfolio simulation platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
prd = "portfolio_research_desk.cli:main"

[dependency-groups]
dev = [
    "hatchling==1.32.4",
    "pytest>=8,<10",
    "pytest-socket>=0.7,<1",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_research_desk"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/scripts", "/configs", "/docs", "/.github",
    "/README.md", "/AGENTS.md", "/pyproject.toml", "/uv.lock",
    "/.python-version", "/.gitignore", "/.gitattributes",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib --disable-socket --basetemp=work/pytest-tmp"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
required-version = "==0.13.6"
