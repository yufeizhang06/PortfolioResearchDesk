name: Offline product, research and CAD paper checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      UV_NO_PROGRESS: "1"
      UV_PYTHON_DOWNLOADS: never
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Checkout and dependency provisioning need network; execution below is offline.
      - name: Install the selected uv version
        run: python -m pip install uv==0.13.6
      - name: Install locked project and developer tools
        run: uv sync --locked --extra data --extra factors --extra ml --extra gui --python "$(python -c 'import sys; print(sys.executable)')"
      - name: Verify lock
        run: uv lock --check --offline
      - name: Lint and formatting
        run: |
          uv run --locked --offline ruff check .
          uv run --locked --offline ruff format --check .
      - name: Offline tests
        run: uv run --locked --offline pytest -p pytest_socket -q
      - name: CLI and configuration
        run: |
          uv run --locked --offline prd --help
          uv run --locked --offline prd config validate --config configs/example_offline.toml
          uv run --locked --offline prd demo
          uv run --locked --offline prd config validate --kind backtest --config configs/example_backtest.toml
          uv run --locked --offline prd backtest run --config configs/example_backtest.toml --run-id ci-offline
          uv run --locked --offline prd universe build
          uv run --locked --offline prd data fetch
          uv run --locked --offline prd config validate --kind factors --config configs/example_factors.toml
          uv run --locked --offline prd research run --run-id ci-factors
          uv run --locked --offline prd config validate --kind ml --config configs/example_ml.toml
          uv run --locked --offline prd ml run --run-id ci-ml
          uv run --locked --offline prd config validate --kind paper --config configs/example_paper.toml
          uv run --locked --offline prd paper demo --db outputs/paper/ci.sqlite3 --run-id ci-paper
          uv run --locked --offline prd paper status --db outputs/paper/ci.sqlite3
          uv run --locked --offline prd doctor --require factors --require ml
          uv run --locked --offline prd workspace init --directory work/ci-desk
          uv run --locked --offline prd config validate --kind workflow --config work/ci-desk/workflow.toml
          uv run --locked --offline prd workflow run --config work/ci-desk/workflow.toml --run-id ci-full --with-factors --with-ml
          uv run --locked --offline prd workflow check --directory work/ci-desk/runs/ci-full
      - name: Inspect installed dependency licenses
        run: uv run --locked --offline python scripts/inspect_licenses.py
      - name: Build distributions with locked backend
        run: uv build --offline --no-build-isolation --out-dir dist/phase6
      - name: Rebuild sdist and check installed wheel outside source tree
        run: uv run --locked --offline python scripts/verify_distribution.py dist/phase6 --with-factors --with-ml --with-gui
