schema_version = 2

[universe]
mode = "market"
source = "nasdaq_listed" # official CURRENT directory, not Nasdaq-100 or historical members
include = ["AAPL", "MSFT"] # explicit request scope; no silent truncation

[data]
adapter = "yfinance"
expected_kind = "real"
start = "2026-10-01"
end = "2026-10-27"
max_assets = 5

[screening]
enabled = true
min_history = 10
momentum_sessions = 5
volatility_sessions = 5
liquidity_sessions = 5
min_dollar_volume = "1000000"

[storage]
cache_dir = "../data/cache"
output_dir = "../outputs/research"
ttl_hours = 24

[network]
attempts = 2
timeout = 10
