schema_version = 1
mode = "backtest"
market = "US"
data_source = "synthetic"
log_level = "INFO"

[universe]
source = "custom"
membership_type = "user_static"
symbols = ["SYN_A", "SYN_B", "SYN_C"]

[account]
base_currency = "USD"
initial_cash = "1000.00"

[strategy]
name = "momentum_top_k"
lookback_sessions = 1
top_k = 2

[portfolio]
max_position_weight = "0.60"
cash_buffer = "0.10"

[execution]
fill_policy = "next_session_open"
fractional_shares = false
commission_bps = "5"
fixed_fee = "0.10"
slippage_bps = "10"
