[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "portfolio-research-desk"
version = "0.7.0"
description = "Time-aware equity research and portfolio simulation platform"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12,<3.13"
dependencies = []

[project.urls]
Repository = "https://github.com/yufeizhang06/PortfolioResearchDesk"

[project.optional-dependencies]
data = ["yfinance>=0.2.65,<2", "pyarrow>=20,<30"]
factors = ["numpy>=2,<3", "scipy>=1.13,<2", "statsmodels>=0.14,<0.16", "matplotlib>=3.9,<4"]
ml = ["scikit-learn>=1.7,<2", "xgboost>=3,<4"]
gui = ["streamlit==1.66.1"]

[project.scripts]
prd = "portfolio_research_desk.cli:main"
prd-gui = "portfolio_research_desk.gui.launch:main"

[dependency-groups]
dev = [
    "hatchling==1.32.4",
    "pytest>=8,<10",
    "pytest-socket>=0.7,<1",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/portfolio_research_desk"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/scripts", "/configs", "/docs", "/.github",
    "/README.md", "/AGENTS.md", "/pyproject.toml", "/uv.lock",
    "/LICENSE", "/THIRD_PARTY_NOTICES.md", "/CONTRIBUTING.md",
    "/.python-version", "/.gitignore", "/.gitattributes",
    "/Start GUI.cmd", "/Setup GUI.cmd",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib --disable-socket"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
required-version = "==0.13.6"
